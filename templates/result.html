<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction Result | Heart Failure ML App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='w3.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- Hero Header -->
  <div class="hero">
    <div class="hero-content">
      <h1>Heart Failure Prediction</h1>
      <p class="subtitle">Your ML Assessment Result</p>
    </div>
  </div>

  <!-- Result Content -->
  <div class="main-container">
    <div class="result-card">
      <h2>Prediction Result</h2>
      <div class="result-value {% if 'Positive' in prediction_text %}positive{% else %}negative{% endif %}">
        {{ prediction_text }}
      </div>
      <p style="color: var(--text-light); margin-top: 1rem;">
        This prediction is generated by our machine learning model based on the health parameters you provided.
      </p>
      <a href="{{ url_for('home') }}" class="btn-home">Back to Form</a>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>Made with <span class="heart">❤️</span> by <span class="made-by">Awais</span> &copy; <span id="year"></span></p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
