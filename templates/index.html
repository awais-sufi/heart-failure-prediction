<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Failure Prediction | ML App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='w3.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- Hero Header -->
  <div class="hero">
    <div class="hero-content">
      <h1>Heart Failure Prediction</h1>
      <p class="subtitle">Machine Learning Powered Health Assessment Tool</p>
      <div class="badge">Enter your details below to get started</div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-container">
    <div class="form-card">
      <h2>Patient Health Details</h2>
      <form action="{{ url_for('predict') }}" method="POST">
        <div class="form-grid">

          <div class="form-group">
            <label for="age"><span class="icon">👤</span> Age</label>
            <input id="age" class="w3-input" name="age" type="number" placeholder="Enter age" required>
          </div>

          <div class="form-group">
            <label for="anaemia"><span class="icon">🩸</span> Anaemia</label>
            <input id="anaemia" class="w3-input" name="anaemia" type="number" placeholder="1 for Yes, 0 for No" required>
          </div>

          <div class="form-group">
            <label for="creatinine_phos"><span class="icon">🧪</span> Creatinine Phosphokinase (mcg/L)</label>
            <input id="creatinine_phos" class="w3-input" name="creatinine_phos" type="number" placeholder="CPK level" required>
          </div>

          <div class="form-group">
            <label for="diabetes"><span class="icon">🍬</span> Diabetes</label>
            <input id="diabetes" class="w3-input" name="diabetes" type="number" placeholder="1 for Yes, 0 for No" required>
          </div>

          <div class="form-group">
            <label for="ejection"><span class="icon">❤️</span> Ejection Fraction (%)</label>
            <input id="ejection" class="w3-input" name="ejection" type="number" placeholder="Ejection fraction" required>
          </div>

          <div class="form-group">
            <label for="hbp"><span class="icon">🩺</span> High Blood Pressure</label>
            <input id="hbp" class="w3-input" name="hbp" type="number" placeholder="1 for Yes, 0 for No" required>
          </div>

          <div class="form-group">
            <label for="plat"><span class="icon">🦠</span> Platelets (kiloplatelets/mL)</label>
            <input id="plat" class="w3-input" name="plat" type="number" placeholder="Platelet count" required>
          </div>

          <div class="form-group">
            <label for="serum_creatinine"><span class="icon">💧</span> Serum Creatinine (mg/dL)</label>
            <input id="serum_creatinine" class="w3-input" name="serum_creatinine" type="number" placeholder="Creatinine level" required>
          </div>

          <div class="form-group">
            <label for="serum_sodium"><span class="icon">🧂</span> Serum Sodium (mEq/L)</label>
            <input id="serum_sodium" class="w3-input" name="serum_sodium" type="number" placeholder="Sodium level" required>
          </div>

          <div class="form-group">
            <label for="sex"><span class="icon">♂️♀️</span> Sex</label>
            <input id="sex" class="w3-input" name="sex" type="number" placeholder="1 for Male, 0 for Female" required>
          </div>

          <div class="form-group">
            <label for="smoking"><span class="icon">🚬</span> Smoking</label>
            <input id="smoking" class="w3-input" name="smoking" type="number" placeholder="1 for Yes, 0 for No" required>
          </div>

          <div class="form-group">
            <label for="time"><span class="icon">⏱️</span> Follow-up Period (days)</label>
            <input id="time" class="w3-input" name="time" type="number" placeholder="Days" required>
          </div>

          <button type="submit" class="btn-predict">Predict Heart Failure Risk</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>Made with <span class="heart">❤️</span> by <span class="made-by">Awais</span> &copy; <span id="year"></span></p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
